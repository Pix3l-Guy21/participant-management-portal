<div class="vh-100 bg-info bg-opacity-25">
    <nav class="navbar navbar-collapse bg-dark text-light px-3">
        <h2 style="color: #d47e0c">Participant Management Portal</h2>
        <button class="btn btn-outline-info" role="button" (click)="logout()">Logout</button>
    </nav>
    <div class="p-3">
        <h2 class="fw-bold text-dark">Welcome to the Participant Management Portal</h2>
        <div class="p-2">
            <h3>Current Participants</h3>
            <div class="table-responsive shadow-sm rounded">
                <table class="table table-hover align-middle bg-white mb-0">
                    <thead class="table-dark text-uppercase fs-7">
                        <tr>
                            <th class="ps-4">Id</th>
                            <th>Name</th>
                            <th>BIC</th>
                            <th>Shorthand</th>
                            <th>Email</th>
                            <th>Phone number</th>
                            <th class="text-center pe-4">Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        @for (item of banks; track item.id) {
                            <tr [class.table-success]="item.status === 'ACTIVE'"
                                [class.table-secondary]="item.status === 'INACTIVE'">
                                <th class="ps-4 fw-semibold">{{item.id}}</th>
                                <td>{{item.name}}</td>
                                <td><code>{{item.bic}}</code></td>
                                <td>{{item.shortName}}</td>
                                <td><a href="mailto:{{item.email}}" class="text-decoration-none">{{item.email}}</a></td>
                                <td>{{item.phoneNumber}}</td>
                                <td class="text-center pe-4">
                                    <span class="badge rounded-pill px-3 py-2" [ngClass]="{
                                        'bg-success': item.status === 'ACTIVE',
                                        'bg-dark bg-opacity-75': item.status === 'INACTIVE'
                                    }">{{item.status}}</span>
                                </td>
                            </tr>
                        }
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
